# Production overrides. Activated with SPRING_PROFILES_ACTIVE=prod.
#
# Only settings that MUST differ from application.properties belong here - everything
# else is inherited, so this file stays short enough to audit at a glance.

# --- Logging -------------------------------------------------------------------
# Cloud Logging bills by volume. show-sql at DEBUG writes a line per query per
# request, which is genuinely useful locally and expensive noise in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.co.za.malangeniblog=INFO
logging.level.org.springframework.web=INFO

# Pretty-printed JSON is for reading in a terminal; in production it only inflates
# every response body over the network.
spring.jackson.serialization.indent-output=false

# --- Secrets -------------------------------------------------------------------
# No local-dev fallbacks here, on purpose. application.properties has placeholder
# defaults pointing at a local Postgres so a fresh checkout is frictionless; in
# production a missing secret must fail loudly at startup rather than silently
# falling back to a localhost URL that will never resolve on Cloud Run.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- API docs ------------------------------------------------------------------
# Swagger UI stays available locally (localhost:8080/swagger-ui/index.html) but is off in
# production, so the full endpoint map isn't published on the internet.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Actuator ------------------------------------------------------------------
# Expose only health. Spring Boot already defaults to health+info over HTTP, but
# stating it means a later `include=*` somewhere can't quietly open everything up
# on an internet-facing URL. Probes split health into /health/liveness and
# /health/readiness, which is what Cloud Run's startup probe should target.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Don't leak component-level detail (database hostnames, disk paths) to anonymous
# callers - the probe only needs the overall UP/DOWN status.
management.endpoint.health.show-details=never
