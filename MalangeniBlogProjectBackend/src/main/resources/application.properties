spring.application.name=MalangeniBlog
# Cloud Run injects a PORT env var and the container MUST listen on it - a container that
# ignores it fails its health check and the revision never goes live. The :8080 fallback
# keeps local runs (and `mvn spring-boot:run`) behaving exactly as before.
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Neon) - migrated from MySQL 2026-07-27.
#
# No defaults on purpose: there is no local Postgres. DB_URL / DB_USERNAME / DB_PASSWORD must be
# supplied by the environment or the app fails at startup with a clear message, rather than
# silently trying a localhost server that does not exist.
#
# Neon's URL as shown in their console is a libpq/psql URL, not a JDBC one. Two changes are
# needed: the scheme becomes jdbc:postgresql://, and `channel_binding` must be dropped - it is
# a libpq-only parameter that the JDBC driver does not implement. `sslmode=require` is kept and
# is supported.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's free tier caps concurrent connections, and every Cloud Run instance carries its own
# pool - so keep each pool small rather than letting Hikari default to 10 per instance.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Neon auto-suspends compute after a period of inactivity; the first connection afterwards has
# to wait for it to wake. The default 30s Hikari timeout covers this, but be explicit about it.
spring.datasource.hikari.connection-timeout=30000

# Flyway owns the schema now. `update` was silently half-applying changes: it added the nullable
# ban columns but skipped banned_from_posting (NOT NULL with no default on a populated table),
# logged the failure as a warning, and let the app start broken.
spring.flyway.enabled=true
# The Neon database already has tables built by ddl-auto, and Flyway refuses to run against a
# non-empty schema it has no history for. This stamps it as already at V1 instead, so V1 is
# skipped there but still runs on a brand-new database.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA/Hibernate Configuration
# `validate` - Hibernate checks the entities against the schema Flyway produced and fails at
# startup on a mismatch, rather than trying to fix it. A forgotten migration is now a loud
# startup error instead of a runtime column-not-found on the first request.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# No explicit hibernate.dialect: Hibernate 6 detects PostgreSQL from the connection and
# actively warns (HHH90000025) if you set it by hand. The old MySQL8Dialect line was carried
# over from Hibernate 5 habits.
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.co.za.malangeniblog=DEBUG
logging.level.org.springframework.web=DEBUG

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Server Configuration
# NOTE: no context-path here - every controller already declares its own "/api/..."
# @RequestMapping prefix. Setting a context-path of "/api" on top of that used to double
# it up into "/api/api/...".

# Cloudinary - profile picture hosting. The URL embeds the API secret, so there is no default:
# a missing CLOUDINARY_URL must fail at startup, not on the first upload.
cloudinary.url=${CLOUDINARY_URL}

# Uploads. Kept just above the 5MB the service enforces, so an oversized file is rejected by our
# own clear error rather than Tomcat's generic one.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Firebase Configuration
# Local dev reads the service-account key from the project root. On Cloud Run this file does not
# exist and FirebaseConfig falls back to Application Default Credentials, so no key is shipped.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-key.json}
# Or the key's contents (raw JSON or base64) in an env var - wins over the file when set.
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# Google Places API (New) key: fills a place's address and opening hours from a pasted Google Maps
# link. Optional - without it the link still gives the pin and directions.
google.places-api-key=${GOOGLE_PLACES_API_KEY:}

# The admin list (comma-separated). This is the ONLY source of admins: it is re-applied on every
# sign-in, promoting listed emails and demoting unlisted ADMIN rows, and the API cannot grant or
# remove ADMIN. Not a secret - the person must still prove ownership of the address via Google.
app.admin-emails=${ADMIN_EMAILS:gumedekhumbulani54@gmail.com,gcinambabe20@gmail.com,nastykgumede@gmail.com}

# Backstage staff: keep their real permissions but appear to the public as ordinary members
# (no staff tag). Used for the developer account.
app.backstage-emails=${BACKSTAGE_EMAILS:nastykgumede@gmail.com}

# Websites allowed to call the API from a browser (comma-separated; patterns like
# https://*.vercel.app work). Set CORS_ALLOWED_ORIGINS on the host to the frontend's address.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

